[build]
  base = "vite-project"
  command = "npm run build:framework-poc"
  publish = "build-framework-poc/client"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[functions."supabase-heartbeat"]
  schedule = "0 9 * * *"
