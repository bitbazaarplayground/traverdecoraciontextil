<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Netlify Forms registry</title>
  </head>
  <body>
    <!--
      Netlify scans static HTML at deploy time to register forms. This document
      intentionally sits outside the React Router hydration tree: Netlify
      removes its detection attributes in deployed HTML, which must not change
      DOM owned by React during client hydration.
    -->
    <div hidden aria-hidden="true">
      <form
        name="asesoramiento"
        method="POST"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="asesoramiento" />
        <p>
          <label>
            Don’t fill this out: <input name="bot-field" />
          </label>
        </p>
        <input name="nombre" />
        <input name="telefono" />
        <input name="email" />
        <input name="preferencia" />
        <textarea name="mensaje"></textarea>
        <input name="meeting_mode" />
        <input name="pack" />
        <input name="kind" />
        <input name="start_time" />
        <input name="end_time" />
        <input name="address_line1" />
        <input name="postal_code" />
        <input name="city" />
        <input name="address_notes" />
      </form>

      <form
        name="quick-enquiry"
        method="POST"
        data-netlify="true"
        data-netlify-honeypot="bot-field"
      >
        <input type="hidden" name="form-name" value="quick-enquiry" />
        <p>
          <label>
            Don’t fill this out: <input name="bot-field" />
          </label>
        </p>
        <input name="nombre" />
        <input name="telefono" />
        <input name="email" />
        <input name="preferencia" />
        <input name="pack" />
        <input name="source" />
        <input name="page" />
        <textarea name="mensaje"></textarea>
        <input name="privacidad" />
      </form>
    </div>
  </body>
</html>
