          var selector = "meta[" + attr + '="' + key + '"]';

            el = document.createElement("meta");
            el.setAttribute(attr, key);

    <script>
      (function () {
        var path = location.pathname.replace(/\/$/, "") || "/";

        function preloadImage(mobileSrc, desktopSrc) {
          var mobile = document.createElement("link");
          mobile.rel = "preload";
          mobile.as = "image";
          mobile.href = mobileSrc;
          mobile.media = "(max-width: 768px)";
          mobile.setAttribute("fetchpriority", "high");
          document.head.appendChild(mobile);

          var desktop = document.createElement("link");
          desktop.rel = "preload";
          desktop.as = "image";
          desktop.href = desktopSrc;
          desktop.media = "(min-width: 769px)";
          desktop.setAttribute("fetchpriority", "high");
          document.head.appendChild(desktop);
        }

        if (path === "/") {
          preloadImage("/Hero/1-mobile.webp", "/Hero/1.webp");
        }
