    <!-- Google Analytics (production only, delayed for performance) -->
    <script>
      (function () {
        var isProd =
          location.hostname === "www.traverdecoraciontextil.es" ||
          location.hostname === "traverdecoraciontextil.es";

        if (!isProd) return;

        var GA_ID = "G-LD3K2K63QX";
        var loaded = false;

        function loadGA() {
          if (loaded) return;
          loaded = true;

          window.dataLayer = window.dataLayer || [];
          window.gtag =
            window.gtag ||
            function () {
              window.dataLayer.push(arguments);
            };

          window.gtag("js", new Date());
          window.gtag("config", GA_ID, { anonymize_ip: true });

          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
          document.head.appendChild(s);
        }

        var isMobile =
          window.matchMedia && window.matchMedia("(max-width: 768px)").matches;

        if (!isMobile) {
          if ("requestIdleCallback" in window) {
            requestIdleCallback(loadGA, { timeout: 2000 });
          } else {
            setTimeout(loadGA, 1200);
          }
          return;
        }

        var onFirstInput = function () {
          window.removeEventListener("pointerdown", onFirstInput);
          window.removeEventListener("keydown", onFirstInput);
          window.removeEventListener("touchstart", onFirstInput);
          loadGA();
        };

        window.addEventListener("pointerdown", onFirstInput, { passive: true });
        window.addEventListener("touchstart", onFirstInput, { passive: true });
        window.addEventListener("keydown", onFirstInput);

        setTimeout(loadGA, 4000);
      })();
    </script>

    <!-- Performance: Hero LCP image -->
    <script>
      (function () {
        var path = location.pathname.replace(/\/$/, "") || "/";

        function preloadImage(mobileSrc, desktopSrc) {
          var mobile = document.createElement("link");
          mobile.rel = "preload";
          mobile.as = "image";
          mobile.href = mobileSrc;
          mobile.media = "(max-width: 768px)";
          mobile.setAttribute("fetchpriority", "high");
          document.head.appendChild(mobile);

          var desktop = document.createElement("link");
          desktop.rel = "preload";
          desktop.as = "image";
          desktop.href = desktopSrc;
          desktop.media = "(min-width: 769px)";
          desktop.setAttribute("fetchpriority", "high");
          document.head.appendChild(desktop);
        }

        if (path === "/") {
          preloadImage("/Hero/1-mobile.webp", "/Hero/1.webp");
        }

        if (path === "/cortinas-estores") {
          preloadImage(
            "/cortinas-estores/hero-768.webp",
            "/cortinas-estores/hero-1280.webp"
          );
        }

        if (path === "/venecianas") {
          preloadImage(
            "/venecianas/oficina2-768.webp",
            "/venecianas/oficina2-1280.webp"
          );
        }

        if (path === "/mosquiteras") {
          preloadImage(
            "/mosquiteras/mosquiteraPatio-768.webp",
            "/mosquiteras/mosquiteraPatio-1280.webp"
          );
        }

        if (path === "/panel-japones") {
          preloadImage(
            "/panelJapones/livingroom2-768.webp",
            "/panelJapones/livingroom2-1280.webp"
          );
        }

        if (path === "/toldos-proteccion-solar") {
          preloadImage(
            "/toldosProteccionSolar/toldo2-768.webp",
            "/toldosProteccionSolar/toldo2-1280.webp"

        if (path === "/propuestas") {
          preloadImage(
            "/propuestas/propuestaHero-768.webp",
            "/propuestas/propuestaHero-1280.webp"

        if (path === "/automatizacion") {
